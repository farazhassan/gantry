site_name: Gantry
site_description: A tiny, testable, Go-native agent runtime with onion-style middleware.
site_url: https://farazhassan.github.io/gantry/
repo_url: https://github.com/farazhassan/gantry
repo_name: farazhassan/gantry
edit_uri: edit/main/docs/

docs_dir: docs
exclude_docs: |
  superpowers/
  requirements.txt

nav:
  - Home: index.md
  - Reference: reference.md
  - Sessions: sessions.md
  - Sessions & Task Management: task-management.md
  - Roadmap: roadmap.md

theme:
  name: material
  logo: assets/brand/gantry-icon.svg
  favicon: assets/brand/gantry-icon.svg
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - navigation.instant
    - content.code.copy
    - content.action.edit
    - toc.follow

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - footnotes
  - tables
  - toc:
      permalink: true
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true

plugins:
  - search

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/farazhassan/gantry
